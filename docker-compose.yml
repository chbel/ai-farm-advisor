name: ai-farm-advisor

# Local development stack.
#   docker compose up -d postgres   -> database only (run services with uvicorn locally)
#   docker compose up -d --build    -> full stack (gateway on http://localhost:8000)
#
# Secrets come from the root .env file (see .env.example). Never commit .env.

services:
  postgres:
    # Postgres 16 + pgvector (needed for RAG). The Debian trixie variant has the
    # same glibc (2.41) as the postgres:16 image that created the existing
    # volume, so text collations stay consistent and the volume is reused as-is.
    image: pgvector/pgvector:0.8.1-pg16-trixie
    container_name: ai-farm-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: farm_admin
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD must be set in .env}
      POSTGRES_DB: postgres
    ports:
      # Bound to localhost only. Default host port 5440 because 5432-5436 are
      # often taken by natively installed PostgreSQL servers on Windows.
      - "127.0.0.1:${POSTGRES_HOST_PORT:-5440}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./infrastructure/database/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U farm_admin -d postgres"]
      interval: 10s
      timeout: 5s
      retries: 5

  identity-service:
    build: ./services/identity-service
    container_name: ai-farm-identity
    restart: unless-stopped
    environment:
      ENVIRONMENT: ${ENVIRONMENT:-development}
      POSTGRES_HOST: postgres
      POSTGRES_PORT: 5432
      POSTGRES_USER: farm_admin
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: identity_db
      JWT_SECRET_KEY: ${JWT_SECRET_KEY:?JWT_SECRET_KEY must be set in .env}
    depends_on:
      postgres:
        condition: service_healthy
    # Not published to the host: clients must go through the API Gateway.

  farm-service:
    build: ./services/farm-service
    container_name: ai-farm-farm
    restart: unless-stopped
    environment:
      ENVIRONMENT: ${ENVIRONMENT:-development}
      POSTGRES_HOST: postgres
      POSTGRES_PORT: 5432
      POSTGRES_USER: farm_admin
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: farm_db
      JWT_SECRET_KEY: ${JWT_SECRET_KEY}
    depends_on:
      postgres:
        condition: service_healthy

  weather-service:
    build: ./services/weather-service
    container_name: ai-farm-weather
    restart: unless-stopped
    environment:
      ENVIRONMENT: ${ENVIRONMENT:-development}
      JWT_SECRET_KEY: ${JWT_SECRET_KEY}
      FARM_SERVICE_URL: http://farm-service:8002
      # Free Open-Meteo endpoints are non-commercial; set these for a paid plan.
      OPEN_METEO_API_KEY: ${OPEN_METEO_API_KEY:-}
    # Needs outbound internet access to reach Open-Meteo.

  irrigation-service:
    build: ./services/irrigation-service
    container_name: ai-farm-irrigation
    restart: unless-stopped
    environment:
      ENVIRONMENT: ${ENVIRONMENT:-development}
      JWT_SECRET_KEY: ${JWT_SECRET_KEY}
      FARM_SERVICE_URL: http://farm-service:8002
      WEATHER_SERVICE_URL: http://weather-service:8003

  disease-detection-service:
    build:
      context: ./services/disease-detection-service
      target: runtime
    container_name: ai-farm-disease
    restart: unless-stopped
    environment:
      ENVIRONMENT: ${ENVIRONMENT:-development}
      JWT_SECRET_KEY: ${JWT_SECRET_KEY}
    volumes:
      # Trained models (not in git): models/<crop>/model.onnx + metadata.json
      - ./services/disease-detection-service/models:/app/models:ro

  api-gateway:
    build: ./api-gateway
    container_name: ai-farm-gateway
    restart: unless-stopped
    environment:
      ENVIRONMENT: ${ENVIRONMENT:-development}
      CORS_ORIGINS: '["http://localhost:5173"]'
      IDENTITY_SERVICE_URL: http://identity-service:8001
      FARM_SERVICE_URL: http://farm-service:8002
      WEATHER_SERVICE_URL: http://weather-service:8003
      IRRIGATION_SERVICE_URL: http://irrigation-service:8004
      DISEASE_SERVICE_URL: http://disease-detection-service:8005
      JWT_SECRET_KEY: ${JWT_SECRET_KEY}
    ports:
      - "127.0.0.1:8000:8000"
    depends_on:
      identity-service:
        condition: service_healthy
      farm-service:
        condition: service_healthy
      weather-service:
        condition: service_healthy
      irrigation-service:
        condition: service_healthy
      disease-detection-service:
        condition: service_healthy

volumes:
  postgres_data:
